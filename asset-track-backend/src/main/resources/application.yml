spring:
  application:
    name: assettrackr

  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/assettrackr}}
    username: ${DB_USERNAME:assettrackr}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKey}
      expiration: 86400000 # 24 hours

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,https://asset-track-ui.vercel.app}

logging:
  level:
    com.assettrackr: INFO
    org.springframework.security: INFO
